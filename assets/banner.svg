<defs><clipPath id="r"><rect width="1200" height="340" rx="14"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#0E0E12"/></linearGradient><radialGradient id="gb" cx="0.9" cy="0.1" r="0.55"><stop offset="0" stop-color="#3B82FF" stop-opacity="0.28"/><stop offset="1" stop-color="#3B82FF" stop-opacity="0"/></radialGradient><radialGradient id="gr" cx="0.02" cy="1.0" r="0.5"><stop offset="0" stop-color="#FF5F57" stop-opacity="0.20"/><stop offset="1" stop-color="#FF5F57" stop-opacity="0"/></radialGradient><radialGradient id="gy" cx="0.58" cy="1.05" r="0.4"><stop offset="0" stop-color="#FEBC2E" stop-opacity="0.14"/><stop offset="1" stop-color="#FEBC2E" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
