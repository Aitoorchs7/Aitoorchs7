<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Aitor Chicano Selles, estudiante de DAM, desarrollador y emprendedor. CobaltIA.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#0E0E12"/></linearGradient><radialGradient id="gb" cx="0.9" cy="0.1" r="0.5"><stop offset="0" stop-color="#3B82FF" stop-opacity="0.12"/><stop offset="1" stop-color="#3B82FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
<style>
.b{animation:pop .6s ease-out both}
.b1{animation-delay:.3s}.b2{animation-delay:1.1s}.b3{animation-delay:1.9s}.b4{animation-delay:2.7s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style></defs>
