<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 250" width="830" height="250" role="img" aria-label="Hoja de ruta: primer piloto en 3 meses, primeros clientes en 12 meses, después SaaS">
<defs><linearGradient id="road" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="700" y2="0"><stop offset="0" stop-color="#FF5F57"/><stop offset=".5" stop-color="#FEBC2E"/><stop offset="1" stop-color="#3B82FF"/></linearGradient></defs>
<rect x="1" y="1" width="828" height="248" rx="12" fill="#0A0A0C" stroke="#2A2A2F" stroke-width="1.5"/>
<path d="M130 74H700" stroke="url(#road)" stroke-width="4" stroke-linecap="round"/>
<text x="130" y="42" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#FF5F57">3 MESES</text>
<circle cx="130" cy="74" r="15" fill="#050506" stroke="#FF5F57" stroke-width="3"/>
<circle cx="130" cy="74" r="6" fill="#FF5F57"/>
<rect x="5" y="110" width="250" height="118" rx="8" fill="#FF5F57" fill-opacity=".07" stroke="#FF5F57" stroke-opacity=".55"/>
<rect x="5" y="110" width="250" height="4" fill="#FF5F57"/>
<text x="130" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#F4F4F5">Primer piloto real</text>
<text x="130" y="169" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">Bot de WhatsApp funcionando en</text>
<text x="130" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">una clínica y un caso de estudio</text>
<text x="130" y="207" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">público con resultados</text>
<text x="415" y="42" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#FEBC2E">12 MESES</text>
<circle cx="415" cy="74" r="15" fill="#050506" stroke="#FEBC2E" stroke-width="3"/>
<circle cx="415" cy="74" r="6" fill="#FEBC2E"/>
<rect x="290" y="110" width="250" height="118" rx="8" fill="#FEBC2E" fill-opacity=".07" stroke="#FEBC2E" stroke-opacity=".55"/>
<rect x="290" y="110" width="250" height="4" fill="#FEBC2E"/>
<text x="415" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#F4F4F5">Primeros clientes</text>
<text x="415" y="169" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">Clientes de pago para CobaltIA</text>
<text x="415" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">y mi app Codo publicada</text>
<text x="700" y="42" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" letter-spacing="2.5" fill="#3B82FF">DESPUÉS</text>
<circle cx="700" cy="74" r="15" fill="#050506" stroke="#3B82FF" stroke-width="3"/>
<circle cx="700" cy="74" r="6" fill="#3B82FF"/>
<rect x="575" y="110" width="250" height="118" rx="8" fill="#3B82FF" fill-opacity=".07" stroke="#3B82FF" stroke-opacity=".55"/>
<rect x="575" y="110" width="250" height="4" fill="#3B82FF"/>
<text x="700" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" fill="#F4F4F5">De servicio a SaaS</text>
<text x="700" y="169" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">Convertir el servicio a medida</text>
<text x="700" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">en un producto SaaS</text>
<text x="700" y="207" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#B4B8C0">para clínicas dentales</text>
</svg>
